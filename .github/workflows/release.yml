name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: 'Publish to npm registry?'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

# Serialize releases so concurrent workflow runs cannot both pass preflight.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Map the secret at the job level so it can be safely evaluated in if conditions
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        id: vars
        run: node scripts/check-release.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run regression tests
        run: npm test

      - name: Build plugin bundle
        run: npm run dist

      - name: Verify build outputs
        run: |
          if ! ls publish/*.jpl 1> /dev/null 2>&1; then
            echo "Error: .jpl file not found in publish/ directory!"
            exit 1
          fi

      # Recheck immediately before publishing in case a release appeared during the build.
      - name: Recheck release version
        run: node scripts/check-release.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 1. Create GitHub Release with the .jpl archive and hash metadata
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Theme Studio ${{ steps.vars.outputs.tag }}
          files: |
            publish/*.jpl
            publish/*.json
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Publish to npm (Safely checks job-level env variable)
      - name: Publish to npm
        if: ${{ (github.event_name == 'push' || inputs.publish_to_npm == true) && env.NPM_TOKEN != '' }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
